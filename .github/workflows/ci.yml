# Pipeline minimo (D3 - Primeira Maneira: fluxo automatizado com feedback rapido)
# 1) testes (regras, integracao simulada e contrato)  2) build da imagem + smoke test
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  imagem:
    name: Imagem Docker + smoke test
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t feriasflow-api:ci .
      - name: Sobe o container e confere o /health (calendario ausente = degradado, ainda 200)
        run: |
          docker run -d --name api -p 8000:8000 feriasflow-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

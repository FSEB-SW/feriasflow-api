# Sobe os dois servicos do MVP (API principal + API secundaria) numa rede privada.
#
#   docker compose up --build
#
# A API secundaria NAO e construida aqui: o pipeline dela (GitHub Actions) publica a imagem no
# GitHub Container Registry a cada merge na main, e este compose so a puxa. E o mesmo fluxo de
# um ambiente real: quem consome um servico usa o artefato publicado, nao o codigo-fonte.
#
# Para construir a secundaria a partir de um clone local (desenvolvendo os dois lados):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
#   principal  -> http://localhost:8000/docs
#   secundaria -> http://localhost:8001/docs

services:
  calendario-api:
    image: ghcr.io/fseb-sw/feriasflow-calendario-api:latest
    pull_policy: always
    container_name: feriasflow-calendario-api
    ports:
      - "8001:8000"
    volumes:
      - calendario_data:/app/data
    restart: unless-stopped

  feriasflow-api:
    build:
      context: .
    image: feriasflow-api:local
    container_name: feriasflow-api
    ports:
      - "8000:8000"
    environment:
      CALENDARIO_URL: http://calendario-api:8000
    volumes:
      - feriasflow_data:/app/data
    depends_on:
      calendario-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  calendario_data:
  feriasflow_data:
